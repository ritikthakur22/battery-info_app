name: Android CI/CD

on:
  push:
    branches: [ "main", "test-build-v2" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Closed Source Notice
      run: echo "Repository is closed-source. Automated cloud builds are disabled."
